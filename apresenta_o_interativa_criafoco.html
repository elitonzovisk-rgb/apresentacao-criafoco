<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CriaFoco — Isaías Eufrosino Rodrigues | Apresentação Interativa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif'],
          },
          colors: {
            brand: {
              dark: '#050814',
              navy: '#0a1128',
              cyan: '#00f0ff',
              blue: '#3b82f6',
              violet: '#7c3aed',
              amber: '#f59e0b'
            }
          }
        }
      }
    }
  </script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050814;
      color: #f8fafc;
    }
    #bg-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    .ambient-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 45%, rgba(10, 17, 40, 0.35) 0%, rgba(5, 8, 20, 0.85) 100%);
      z-index: 1;
      pointer-events: none;
    }
    .glass-panel {
      background: rgba(13, 21, 46, 0.55);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }
    .glass-card {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.02) 100%);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.09);
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.35s ease, box-shadow 0.35s ease;
    }
    .glass-card:hover {
      transform: translateY(-4px);
      border-color: rgba(0, 240, 255, 0.45);
      box-shadow: 0 12px 32px rgba(0, 240, 255, 0.15);
    }
    .text-gradient-cyan {
      background: linear-gradient(135deg, #ffffff 0%, #7dd3fc 45%, #00f0ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .text-gradient-gold {
      background: linear-gradient(135deg, #fef08a 0%, #f59e0b 55%, #ea580c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .text-gradient-violet {
      background: linear-gradient(135deg, #e0e7ff 0%, #a78bfa 50%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Stagger Slide Animations */
    @keyframes fadeUpIn {
      0% {
        opacity: 0;
        transform: translateY(26px) scale(0.98);
        filter: blur(4px);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }
    .animate-stagger {
      opacity: 0;
      animation: fadeUpIn 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .delay-1 { animation-delay: 0.08s; }
    .delay-2 { animation-delay: 0.18s; }
    .delay-3 { animation-delay: 0.28s; }
    .delay-4 { animation-delay: 0.38s; }
    .delay-5 { animation-delay: 0.48s; }

    /* Custom Scrollbar for mobile overflow safety */
    .slide-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .slide-scroll::-webkit-scrollbar-thumb {
      background: rgba(0, 240, 255, 0.3);
      border-radius: 9999px;
    }
  </style>
</head>
<body class="antialiased selection:bg-cyan-500 selection:text-slate-950">

  <!-- Animated Background Canvas -->
  <canvas id="bg-canvas"></canvas>
  <div class="ambient-overlay"></div>

  <!-- Top Navigation Bar -->
  <header class="fixed top-0 left-0 right-0 z-30 flex items-center justify-between px-4 sm:px-8 py-4 pointer-events-none">
    <!-- Brand Mark with Magnifying Glass (Lupa) -->
    <div onclick="goToSlide(0)" class="flex items-center gap-3 pointer-events-auto cursor-pointer group">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center shadow-lg shadow-cyan-500/25 group-hover:scale-105 transition-transform">
        <svg class="w-5 h-5 text-slate-950" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.6">
          <circle cx="10.5" cy="10.5" r="6.5" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.5 15.5L21 21" />
        </svg>
      </div>
      <div>
        <span class="font-display font-bold tracking-wider text-sm sm:text-base text-white">CRIA<span class="text-cyan-400">FOCO</span></span>
        <span class="hidden md:inline-block text-xs text-slate-400 ml-2 border-l border-slate-700 pl-2">Isaías Eufrosino Rodrigues</span>
      </div>
    </div>

    <!-- Language Switcher & Controls -->
    <div class="flex items-center gap-2 sm:gap-3 pointer-events-auto">
      <!-- Language Pill -->
      <div class="glass-panel rounded-full p-1 flex items-center gap-1" role="group" aria-label="Language selector">
        <button onclick="setLanguage('pt')" id="lang-pt" class="lang-btn px-3 py-1 rounded-full text-xs font-bold tracking-wide transition-all bg-cyan-400 text-slate-950 shadow-sm">PT</button>
        <button onclick="setLanguage('en')" id="lang-en" class="lang-btn px-3 py-1 rounded-full text-xs font-bold tracking-wide transition-all text-slate-300 hover:text-white">EN</button>
        <button onclick="setLanguage('es')" id="lang-es" class="lang-btn px-3 py-1 rounded-full text-xs font-bold tracking-wide transition-all text-slate-300 hover:text-white">ES</button>
      </div>

      <!-- Slide Index Overview Button -->
      <button onclick="toggleOverview()" title="Visão Geral / Slides" class="glass-panel hover:border-cyan-400/50 text-slate-200 hover:text-cyan-300 p-2.5 rounded-full transition-all">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
        </svg>
      </button>

      <!-- Fullscreen Toggle Button -->
      <button onclick="toggleFullscreen()" title="Tela Cheia / Fullscreen" class="glass-panel hover:border-cyan-400/50 text-slate-200 hover:text-cyan-300 p-2.5 rounded-full transition-all">
        <svg id="fs-icon" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
        </svg>
      </button>
    </div>
  </header>

  <!-- Main Stage Container -->
  <main id="stage" class="relative z-10 w-full h-full flex items-center justify-center px-4 sm:px-12 md:px-20 pt-16 pb-20">
    <!-- Dynamic Slide Content Injected Here -->
  </main>

  <!-- Side Navigation Arrows (Desktop & Tablet) -->
  <button onclick="prevSlide()" id="btn-prev" aria-label="Slide anterior" class="fixed left-3 sm:left-6 top-1/2 -translate-y-1/2 z-20 glass-panel hover:border-cyan-400/60 text-slate-300 hover:text-cyan-300 p-3 sm:p-3.5 rounded-full transition-all opacity-75 hover:opacity-100 disabled:opacity-20 disabled:pointer-events-none">
    <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
    </svg>
  </button>

  <button onclick="nextSlide()" id="btn-next" aria-label="Próximo slide" class="fixed right-3 sm:right-6 top-1/2 -translate-y-1/2 z-20 glass-panel hover:border-cyan-400/60 text-slate-300 hover:text-cyan-300 p-3 sm:p-3.5 rounded-full transition-all opacity-75 hover:opacity-100 disabled:opacity-20 disabled:pointer-events-none">
    <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
    </svg>
  </button>

  <!-- Bottom Progress Bar & Slide Indicator -->
  <footer class="fixed bottom-0 left-0 right-0 z-30 px-4 sm:px-8 py-4 flex flex-col gap-2 pointer-events-none">
    <div class="flex items-center justify-between text-xs text-slate-400 font-medium">
      <span id="slide-category" class="uppercase tracking-widest text-cyan-400/90 font-semibold">CRIAFOCO</span>
      <div class="flex items-center gap-4 pointer-events-auto">
        <span class="hidden sm:inline text-slate-500" id="nav-hint">Use ← → ou Espaço para navegar</span>
        <span id="slide-counter" class="font-display font-bold text-slate-200 bg-slate-900/70 px-3 py-1 rounded-full border border-white/10">01 / 22</span>
      </div>
    </div>
    <div class="w-full h-1.5 bg-slate-800/80 rounded-full overflow-hidden backdrop-blur-sm">
      <div id="progress-bar" class="h-full bg-gradient-to-r from-cyan-400 via-blue-500 to-violet-500 transition-all duration-500 ease-out rounded-full" style="width: 4.54%"></div>
    </div>
  </footer>

  <!-- Slide Grid Overview Modal -->
  <div id="overview-modal" class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-xl hidden flex-col p-6 sm:p-10 overflow-y-auto">
    <div class="max-w-6xl w-full mx-auto flex items-center justify-between mb-8">
      <div>
        <h2 id="overview-title" class="font-display text-2xl font-bold text-white">Mapa da Apresentação</h2>
        <p id="overview-subtitle" class="text-sm text-slate-400">Clique em qualquer slide para ir diretamente até ele</p>
      </div>
      <button onclick="toggleOverview()" class="glass-panel hover:border-cyan-400 text-white px-4 py-2 rounded-full text-sm font-medium flex items-center gap-2">
        <span>Fechar</span>
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="overview-grid" class="max-w-6xl w-full mx-auto grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 pb-10">
      <!-- Thumbnails generated via JS -->
    </div>
  </div>

  <!-- Toast Notification (for Copy actions - zero alert() usage) -->
  <div id="toast" class="fixed bottom-16 left-1/2 -translate-x-1/2 z-50 glass-panel border-cyan-400/50 text-cyan-200 px-5 py-2.5 rounded-full text-sm font-medium shadow-2xl opacity-0 pointer-events-none transition-all duration-300 flex items-center gap-2">
    <svg class="w-4 h-4 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
    <span id="toast-msg">Copiado!</span>
  </div>

  <script>
    // Reusable Lupa SVG Helper
    const lupaIconSVG = (cls = "w-7 h-7") => `
      <svg class="${cls}" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.4">
        <circle cx="10.5" cy="10.5" r="6.5" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.5 15.5L21 21" />
      </svg>
    `;

    // =========================================================================
    // 1. MULTILINGUAL CONTENT REPOSITORY — 22 SLIDES (PT | EN | ES)
    // =========================================================================
    const translations = {
      pt: {
        ui: {
          hint: "Use ← → ou Espaço para navegar",
          overviewTitle: "Mapa da Apresentação (25 Slides)",
          overviewSub: "Clique em qualquer slide para saltar diretamente",
          copiedEmail: "E-mail copiado para a área de transferência!",
          copiedPhone: "Telefone/WhatsApp copiado!"
        },
        slides: [
          // 01: Capa Oficial
          {
            category: "01 • Abertura",
            title: "CriaFoco — Isaías Eufrosino Rodrigues",
            render: () => `
              <div class="max-w-4xl w-full text-center flex flex-col items-center">
                <div class="animate-stagger delay-1 inline-flex items-center gap-3 px-5 py-2 rounded-full glass-panel border-cyan-400/35 text-cyan-300 text-xs sm:text-sm font-bold tracking-[0.2em] uppercase mb-6">
                  ${lupaIconSVG("w-4 h-4 text-cyan-400")}
                  <span>WWW.CRIAFOCO.COM.BR</span>
                </div>
                <div class="animate-stagger delay-2 flex items-center justify-center gap-4 mb-4">
                  <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center text-slate-950 shadow-xl shadow-cyan-500/25">
                    ${lupaIconSVG("w-8 h-8 sm:w-9 sm:h-9")}
                  </div>
                  <h1 class="font-display text-5xl sm:text-7xl md:text-8xl font-black tracking-tight text-white">
                    CRIA<span class="text-gradient-cyan">FOCO</span>

                </div>
                <p class="animate-stagger delay-3 text-base sm:text-xl text-slate-300 font-light max-w-2xl mb-9">

                <div class="animate-stagger delay-4 glass-panel px-6 py-4 rounded-2xl flex flex-col sm:flex-row items-center gap-4 sm:gap-6">
                  <div class="text-center sm:text-left">
                    <p class="text-[11px] uppercase tracking-widest text-cyan-400 font-bold">Palestrante & Consultor</p>
                    <p class="text-base sm:text-lg font-extrabold text-white">ISAÍAS EUFROSINO RODRIGUES</p>

                  <div class="hidden sm:block w-px h-8 bg-white/15"></div>
                  <button onclick="nextSlide()" class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-cyan-400 to-blue-600 text-slate-950 font-bold text-sm hover:brightness-110 transition-all shadow-lg shadow-cyan-500/25 flex items-center gap-2 cursor-pointer">
                    <span>Iniciar Apresentação</span>
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>
                  </button>
                </div>
              </div>
            `
          },
          // 02: Sonhar & Imaginação
          {
            category: "02 • Visão & Imaginação",
            title: "Se Você Pode Sonhar, Você Pode Fazer",
            render: () => `
              <div class="max-w-5xl w-full flex flex-col gap-7 items-center text-center">
                <div class="animate-stagger delay-1 glass-panel p-8 sm:p-12 rounded-3xl w-full border-cyan-400/25 relative overflow-hidden">
                  <span class="text-xs uppercase tracking-[0.25em] text-cyan-400 font-bold block mb-3">Ponto de Partida</span>
                  <h2 class="font-display text-3xl sm:text-5xl md:text-6xl font-extrabold text-white leading-tight">
                    “SE VOCÊ PODE <span class="text-gradient-cyan">SONHAR</span>,<br/>VOCÊ PODE <span class="text-gradient-gold">FAZER</span>.”
                  </h2>
                </div>

                <div class="animate-stagger delay-2 glass-card p-6 sm:p-8 rounded-2xl max-w-3xl w-full flex flex-col sm:flex-row items-center gap-5 text-left">
                  <div class="w-12 h-12 rounded-xl bg-violet-500/20 border border-violet-400/30 flex items-center justify-center shrink-0 text-violet-300 font-display text-3xl font-bold">“</div>
                  <div>
                    <p class="text-lg sm:text-2xl font-medium text-slate-100 italic leading-relaxed">

          // 03: Historiando (4 - 9 - 12 - 20 - 30 - 60 - 70)
          {
            category: "03 • Historiando",

            render: () => {
              const milestones = [
                { age: "4", stage: "Infância", note: "Descoberta do mundo" },
                { age: "9", stage: "Curiosidade", note: "Primeiros porquês" },
                { age: "12", stage: "Identidade", note: "Transição e sonhos" },

              return `

          // 04: Dr. Shigeaki

            render: () => `

          // 05: Processo Criativo — Visão Geral

            category: "05 • Processo Criativo",
            title: "Processo Criativo — As 5 Etapas",
            render: () => {

                { num: "01", title: "INQUIETAÇÃO", sub: "Dqm" },
                { num: "02", title: "PREPARAÇÃO", sub: "Imersão" },
                { num: "03", title: "INCUBAÇÃO", sub: "Maturação" },
                { num: "04", title: "ILUMINAÇÃO", sub: "Insight" },
                { num: "05", title: "VERIFICAÇÃO", sub: "Validação" }

              return `
                <div class="max-w-6xl w-full flex flex-col items-center text-center gap-8">

            }

          // 06: Processo Criativo — Etapa 1: INQUIETAÇÃO (Dqm)
          {
            category: "06 • Processo Criativo (1/5)",
            title: "Inquietação — Dqm",
            render: () => `
              <div class="max-w-4xl w-full flex flex-col items-center text-center">
                <div class="animate-stagger delay-1 glass-panel p-8 sm:p-12 rounded-3xl w-full border-cyan-400/35">
                  <div class="inline-flex items-center gap-2 px-4 py-1 rounded-full bg-cyan-500/15 border border-cyan-400/30 text-cyan-300 text-xs font-bold uppercase tracking-widest mb-4">
                    Etapa 01 de 05
                  </div>
                  <h2 class="font-display text-4xl sm:text-6xl font-black text-gradient-cyan mb-4">INQUIETAÇÃO</h2>

      }
    };

    // =========================================================================
    // 2. PRESENTATION STATE & NAVIGATION LOGIC
    // =========================================================================
    let currentLang = 'pt';
    let currentSlide = 0;
    let isOverviewOpen = false;

    const stageEl = document.getElementById('stage');
    const categoryEl = document.getElementById('slide-category');
    const counterEl = document.getElementById('slide-counter');
    const progressEl = document.getElementById('progress-bar');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const navHintEl = document.getElementById('nav-hint');

    function renderSlide() {
      const langData = translations[currentLang];
      const total = langData.slides.length;
      const slideObj = langData.slides[currentSlide];

      // Update stage HTML
      stageEl.innerHTML = `<div class="w-full h-full flex items-center justify-center overflow-y-auto slide-scroll py-2">${slideObj.render()}</div>`;

      // Update footer metadata
      categoryEl.textContent = slideObj.category;
      counterEl.textContent = `${String(currentSlide + 1).padStart(2, '0')} / ${String(total).padStart(2, '0')}`;
      progressEl.style.width = `${((currentSlide + 1) / total) * 100}%`;
      navHintEl.textContent = langData.ui.hint;

      // Update navigation buttons state
      btnPrev.disabled = currentSlide === 0;
      btnNext.disabled = currentSlide === total - 1;

      if (isOverviewOpen) {
        renderOverviewGrid();
      }
    }

    function nextSlide() {
      const total = translations[currentLang].slides.length;
      if (currentSlide < total - 1) {
        currentSlide++;
        renderSlide();
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide();
      }
    }

    function goToSlide(index) {
      currentSlide = index;
      if (isOverviewOpen) toggleOverview();
      renderSlide();
    }

    function setLanguage(lang) {
      if (!translations[lang]) return;
      currentLang = lang;

      // Update active pill styling
      ['pt', 'en', 'es'].forEach(code => {
        const btn = document.getElementById(`lang-${code}`);
        if (code === lang) {
          btn.className = 'lang-btn px-3 py-1 rounded-full text-xs font-bold tracking-wide transition-all bg-cyan-400 text-slate-950 shadow-sm';
        } else {
          btn.className = 'lang-btn px-3 py-1 rounded-full text-xs font-bold tracking-wide transition-all text-slate-300 hover:text-white';
        }
      });

      document.getElementById('overview-title').textContent = translations[lang].ui.overviewTitle;
      document.getElementById('overview-subtitle').textContent = translations[lang].ui.overviewSub;

      renderSlide();
    }

    // Overview Grid Modal
    function toggleOverview() {
      const modal = document.getElementById('overview-modal');
      isOverviewOpen = !isOverviewOpen;
      if (isOverviewOpen) {
        renderOverviewGrid();
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      } else {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
    }

    function renderOverviewGrid() {
      const grid = document.getElementById('overview-grid');
      const slides = translations[currentLang].slides;
      grid.innerHTML = slides.map((s, idx) => `
        <button onclick="goToSlide(${idx})" class="glass-card p-5 rounded-2xl text-left flex flex-col justify-between h-36 ${idx === currentSlide ? 'border-cyan-400 bg-cyan-500/15' : ''}">
          <div class="flex items-center justify-between w-full">
            <span class="font-display text-sm font-black ${idx === currentSlide ? 'text-cyan-300' : 'text-slate-400'}">${String(idx + 1).padStart(2, '0')}</span>
            <span class="text-[10px] uppercase tracking-wider text-cyan-400/80 font-semibold">${s.category}</span>
          </div>
          <h3 class="font-display text-base font-bold text-white line-clamp-2 mt-2">${s.title}</h3>
        </button>
      `).join('');
    }

    // Fullscreen Handler
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        }
      }
    }

    // Clipboard Helper (without alert())
    function copyText(text, type) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        const msg = type === 'email'
          ? translations[currentLang].ui.copiedEmail
          : translations[currentLang].ui.copiedPhone;
        showToast(msg);
      } catch (err) {
        showToast(text);
      }
      document.body.removeChild(textarea);
    }

    let toastTimer;
    function showToast(message) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-msg');
      toastMsg.textContent = message;
      toast.classList.remove('opacity-0', 'translate-y-2');
      toast.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        toast.classList.remove('opacity-100', 'translate-y-0');
      }, 2800);
    }

    // Keyboard & Touch Navigation
    document.addEventListener('keydown', (e) => {
      if (isOverviewOpen && e.key === 'Escape') {
        toggleOverview();
        return;
      }
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        prevSlide();
      } else if (e.key === 'f' || e.key === 'F') {
        toggleFullscreen();
      }
    });

    // Touch Swipe Support for Mobile
    let touchStartX = 0;
    let touchEndX = 0;
    document.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    document.addEventListener('touchend', e => {
      touchEndX = e.changedTouches[0].screenX;
      const diff = touchStartX - touchEndX;
      if (Math.abs(diff) > 55) {
        if (diff > 0) nextSlide();
        else prevSlide();
      }
    }, { passive: true });

    // =========================================================================
    // 3. ANIMATED TECH CANVAS BACKGROUND (NEURAL NETWORK + FLOWING WAVES)
    // =========================================================================
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let width, height, particles = [];
    let mouse = { x: null, y: null };
    let tick = 0;

    function resizeCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initParticles();
    }

    class Particle {
      constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.vx = (Math.random() - 0.5) * 0.45;
        this.vy = (Math.random() - 0.5) * 0.45;
        this.radius = Math.random() * 1.8 + 0.7;
        this.hue = Math.random() > 0.3 ? 190 : 255; // Cyan or Violet
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > width) this.vx *= -1;
        if (this.y < 0 || this.y > height) this.vy *= -1;
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${this.hue}, 95%, 65%, 0.75)`;
        ctx.fill();
      }
    }

    function initParticles() {
      particles = [];
      const count = Math.min(Math.floor((width * height) / 14000), 95);
      for (let i = 0; i < count; i++) {
        particles.push(new Particle());
      }
    }

    function drawWaves() {
      for (let w = 0; w < 3; w++) {
        ctx.beginPath();
        const amplitude = 35 + w * 18;
        const frequency = 0.0022 - w * 0.0004;
        const yOffset = height * (0.35 + w * 0.16);
        ctx.moveTo(0, yOffset);

        for (let x = 0; x <= width; x += 20) {
          const y = yOffset + Math.sin(x * frequency + tick * (0.012 + w * 0.004) + w) * amplitude;
          ctx.lineTo(x, y);
        }

        ctx.strokeStyle = w === 1
          ? 'rgba(0, 240, 255, 0.09)'
          : 'rgba(124, 58, 237, 0.08)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    }

    function animateBg() {
      tick++;
      // Deep tech gradient background
      const grad = ctx.createLinearGradient(0, 0, width, height);
      grad.addColorStop(0, '#040711');
      grad.addColorStop(0.5, '#09122b');
      grad.addColorStop(1, '#060a1c');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);

      // Subtle glowing orbs
      const orbX = width * 0.5 + Math.cos(tick * 0.005) * (width * 0.22);
      const orbY = height * 0.45 + Math.sin(tick * 0.007) * (height * 0.15);
      const orbGrad = ctx.createRadialGradient(orbX, orbY, 10, orbX, orbY, Math.max(width, height) * 0.45);
      orbGrad.addColorStop(0, 'rgba(0, 240, 255, 0.09)');
      orbGrad.addColorStop(0.5, 'rgba(59, 130, 246, 0.04)');
      orbGrad.addColorStop(1, 'rgba(5, 8, 20, 0)');
      ctx.fillStyle = orbGrad;
      ctx.fillRect(0, 0, width, height);

      drawWaves();

      // Update & connect particles
      const maxDist = 145;
      for (let i = 0; i < particles.length; i++) {
        const p1 = particles[i];
        p1.update();
        p1.draw();

        for (let j = i + 1; j < particles.length; j++) {
          const p2 = particles[j];
          const dx = p1.x - p2.x;
          const dy = p1.y - p2.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < maxDist) {
            const alpha = (1 - dist / maxDist) * 0.22;
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.strokeStyle = `rgba(56, 189, 248, ${alpha})`;
            ctx.lineWidth = 0.8;
            ctx.stroke();
          }
        }

        // Subtle mouse interaction
        if (mouse.x !== null && mouse.y !== null) {
          const mdx = p1.x - mouse.x;
          const mdy = p1.y - mouse.y;
          const mDist = Math.sqrt(mdx * mdx + mdy * mdy);
          if (mDist < 170) {
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(mouse.x, mouse.y);
            ctx.strokeStyle = `rgba(0, 240, 255, ${(1 - mDist / 170) * 0.35})`;
            ctx.lineWidth = 1;
            ctx.stroke();
          }
        }
      }

      requestAnimationFrame(animateBg);
    }

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });
    window.addEventListener('mouseleave', () => {
      mouse.x = null;
      mouse.y = null;
    });

    window.onload = function () {
      resizeCanvas();
      animateBg();
      renderSlide();
    };
  </script>
